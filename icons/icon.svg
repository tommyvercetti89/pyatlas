<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="50%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#161c2b"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Subtle cyber circuit ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(99,102,241,0.18)" stroke-width="4" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(6,182,212,0.15)" stroke-width="2"/>
  
  <!-- Main Glowing Center Symbol: Stylized Code & Python Shield -->
  <g filter="url(#glow)">
    <!-- Left bracket < -->
    <path d="M190 170 L96 256 L190 342" fill="none" stroke="url(#grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right bracket > -->
    <path d="M322 170 L416 256 L322 342" fill="none" stroke="url(#grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Central Shield / Core Node -->
    <circle cx="256" cy="256" r="28" fill="#06b6d4"/>
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  </g>
</svg>
